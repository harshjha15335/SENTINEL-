[project]
name = "sentinel-api"
version = "0.1.0"
description = "SENTINEL payment trust & recovery API"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic/", "tests/"]
