name: Render staging container acceptance (no deployment)

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-image-fixture-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build exact checkout and verify isolated synthetic staging
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/verify_render_staging_container.py
          --expected-sha "$EXPECTED_SHA"
          --output "$RUNNER_TEMP/sentinel-staging-container"
      - name: Retain build, TLS and startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-container-${{ github.sha }}
          path: ${{ runner.temp }}/sentinel-staging-container
          if-no-files-found: warn
          retention-days: 14
