# Render-only, review-only demo Blueprint. Do not apply without deployment approval.
# Official project: prj-dbq48lon74is739m7nl0 (Sentinel / My Workspace).
# Stage first; manually deploy and verify the exact approved commit SHA.
# Service auto-deploy is disabled; Blueprint auto-sync must also remain disabled
# in Render. This local file does not prove or change existing account settings.
# Runs in fixture mode (SIMULATED PayPal records) with the SYNTHETIC_DEMO scenario loaded.
# To use PayPal sandbox instead, set SENTINEL_PAYPAL_MODE=sandbox and the two credential
# variables in the Render dashboard. There is deliberately no live (production) PayPal mode.
previews:
  generation: 'off'
services:
  - type: web
    name: sentinel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ready
    autoDeployTrigger: 'off'
    envVars:
      - key: SENTINEL_DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: SENTINEL_ENVIRONMENT
        value: demo
      - key: SENTINEL_PAYPAL_MODE
        value: fixture
      - key: SENTINEL_COOKIE_SECURE
        value: "true"
      - key: SENTINEL_DEMO_AUTOLOAD
        value: "true"
      # Demo sign-in passwords are generated by Render; read them under Environment.
      - key: SENTINEL_SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SENTINEL_SEED_ANALYST_PASSWORD
        generateValue: true
      - key: SENTINEL_SEED_VIEWER_PASSWORD
        generateValue: true
      - key: SENTINEL_PAYPAL_CLIENT_ID
        sync: false
      - key: SENTINEL_PAYPAL_CLIENT_SECRET
        sync: false
      - key: SENTINEL_PAYPAL_WEBHOOK_ID
        sync: false

databases:
  - name: sentinel-db
    plan: free
    databaseName: sentinel
    user: sentinel
